<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
    >

    <title>Biểu mẫu đăng nhập</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome của thư mục ex3 -->
    <link
        rel="stylesheet"
        href="css/all.min.css"
    >
</head>

<body>

    <div class="container py-4">

        <!-- ================================================== -->
        <!-- 1. HORIZONTAL FORM -->
        <!-- ================================================== -->

        <div class="card mb-5">

            <div class="card-header bg-info-subtle text-info-emphasis">
                Biểu mẫu đăng nhập
            </div>

            <div class="card-body">

                <form>

                    <!-- Email -->
                    <div class="row mb-3 align-items-center">

                        <label
                            for="horizontalEmail"
                            class="col-sm-3 col-md-3 col-form-label fw-bold text-end"
                        >
                            Email:
                        </label>

                        <div class="col-sm-7 col-md-7">
                            <input
                                type="email"
                                class="form-control"
                                id="horizontalEmail"
                                placeholder="Nhập vào email"
                            >
                        </div>

                    </div>

                    <!-- Mật khẩu -->
                    <div class="row mb-3 align-items-center">

                        <label
                            for="horizontalPassword"
                            class="col-sm-3 col-md-3 col-form-label fw-bold text-end"
                        >
                            Mật khẩu:
                        </label>

                        <div class="col-sm-7 col-md-7">
                            <input
                                type="password"
                                class="form-control"
                                id="horizontalPassword"
                                placeholder="Nhập vào mật khẩu"
                            >
                        </div>

                    </div>

                    <!-- Ghi nhớ -->
                    <div class="row mb-3">

                        <div class="offset-sm-3 col-sm-7">

                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="horizontalRemember"
                                >

                                <label
                                    class="form-check-label"
                                    for="horizontalRemember"
                                >
                                    Ghi nhớ tôi
                                </label>
                            </div>

                        </div>

                    </div>

                    <!-- Đăng nhập -->
                    <div class="row">

                        <div class="offset-sm-3 col-sm-7">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Đăng nhập
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>


        <!-- ================================================== -->
        <!-- 2. VERTICAL FORM -->
        <!-- ================================================== -->

        <div class="card mb-5">

            <div class="card-header bg-info-subtle text-info-emphasis">
                Biểu mẫu đăng nhập
            </div>

            <div class="card-body">

                <form>

                    <!-- Email -->
                    <div class="mb-3">

                        <label
                            for="verticalEmail"
                            class="form-label fw-bold"
                        >
                            Email:
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="verticalEmail"
                            placeholder="Nhập vào email"
                        >

                    </div>

                    <!-- Password -->
                    <div class="mb-3">

                        <label
                            for="verticalPassword"
                            class="form-label fw-bold"
                        >
                            Password:
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="verticalPassword"
                            placeholder="Nhập vào mật khẩu"
                        >

                    </div>

                    <!-- Ghi nhớ -->
                    <div class="mb-3">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="verticalRemember"
                            >

                            <label
                                class="form-check-label"
                                for="verticalRemember"
                            >
                                Ghi nhớ tôi
                            </label>

                        </div>

                    </div>

                    <!-- Đăng nhập -->
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Đăng nhập
                    </button>

                </form>

            </div>

        </div>


        <!-- ================================================== -->
        <!-- 3. INLINE FORM -->
        <!-- ================================================== -->

        <div class="card mb-5">

            <div class="card-header bg-primary text-white fw-bold">
                Biểu mẫu đăng nhập
            </div>

            <div class="card-body">

                <form class="row g-2 align-items-center">

                    <!-- Email -->
                    <div class="col-auto">

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa-solid fa-user"></i>
                            </span>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="Nhập vào email"
                                aria-label="Email"
                            >

                        </div>

                    </div>


                    <!-- Mật khẩu -->
                    <div class="col-auto">

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Nhập vào mật khẩu"
                                aria-label="Mật khẩu"
                            >

                        </div>

                    </div>


                    <!-- Ghi nhớ -->
                    <div class="col-auto">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="inlineRemember"
                            >

                            <label
                                class="form-check-label"
                                for="inlineRemember"
                            >
                                Ghi nhớ tôi
                            </label>

                        </div>

                    </div>


                    <!-- Đăng nhập -->
                    <div class="col-auto">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Đăng nhập
                        </button>

                    </div>

                </form>

            </div>

        </div>


        <!-- ================================================== -->
        <!-- 4. LOGIN MODAL -->
        <!-- ================================================== -->

        <div class="mb-4">

            <h4 class="mb-3">
                Hộp thoại đăng nhập (Login Modal)
            </h4>

            <div class="border border-danger p-3">

                <h2 class="h4 mb-3">
                    Mở biểu mẫu đăng nhập
                </h2>

                <!-- Nút mở Modal -->
                <button
                    type="button"
                    class="btn btn-info text-white"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                >
                    Mở hộp thoại
                </button>

            </div>

        </div>

    </div>


    <!-- ================================================== -->
    <!-- LOGIN MODAL -->
    <!-- ================================================== -->

    <div
        class="modal fade"
        id="loginModal"
        tabindex="-1"
        aria-labelledby="loginModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg">

            <div class="modal-content">


                <!-- Header -->
                <div class="modal-header">

                    <h2
                        class="modal-title fs-3"
                        id="loginModalLabel"
                    >
                        <i class="fa-solid fa-lock"></i>
                        Đăng nhập
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <!-- Body -->
                <div class="modal-body">

                    <form>

                        <!-- Người dùng -->
                        <div class="mb-3">

                            <label
                                for="modalUsername"
                                class="form-label fw-bold"
                            >
                                <i class="fa-solid fa-user"></i>
                                Người dùng:
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="modalUsername"
                                placeholder="Nhập tên người dùng"
                            >

                        </div>


                        <!-- Mật khẩu -->
                        <div class="mb-3">

                            <label
                                for="modalPassword"
                                class="form-label fw-bold"
                            >
                                <i class="fa-solid fa-eye"></i>
                                Mật khẩu:
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="modalPassword"
                                placeholder="Nhập mật khẩu"
                            >

                        </div>


                        <!-- Ghi nhớ -->
                        <div class="mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="modalRemember"
                                >

                                <label
                                    class="form-check-label"
                                    for="modalRemember"
                                >
                                    Ghi nhớ tôi
                                </label>

                            </div>

                        </div>


                        <!-- Đăng nhập -->
                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            <i class="fa-solid fa-power-off"></i>
                            Đăng nhập
                        </button>

                    </form>

                </div>


                <!-- Footer -->
                <div class="modal-footer justify-content-between">

                    <button
                        type="button"
                        class="btn btn-danger"
                        data-bs-dismiss="modal"
                    >
                        <i class="fa-solid fa-xmark"></i>
                        Hủy bỏ
                    </button>

                    <div class="text-end">

                        <div>
                            Bạn chưa phải là thành viên?
                            <a href="#">Đăng ký</a>
                        </div>

                        <div>
                            <a href="#">Quên mật khẩu?</a>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
